name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-secrets:
    name: Check Available Secrets
    runs-on: ubuntu-latest
    outputs:
      has_anthropic: ${{ steps.check.outputs.has_anthropic }}
      has_openai: ${{ steps.check.outputs.has_openai }}
      has_google: ${{ steps.check.outputs.has_google }}
      has_azure: ${{ steps.check.outputs.has_azure }}
      has_ollama: ${{ steps.check.outputs.has_ollama }}
      has_github_copilot: ${{ steps.check.outputs.has_github_copilot }}
    steps:
      - name: Check which secrets are available
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GH_COPILOT_REFRESH: ${{ secrets.GH_COPILOT_REFRESH }}
          GH_COPILOT_ACCESS: ${{ secrets.GH_COPILOT_ACCESS }}
        run: |
          echo "has_anthropic=$([[ -n \"$ANTHROPIC_API_KEY\" || -n \"$ANTHROPIC_AUTH_TOKEN\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_openai=$([[ -n \"$OPENAI_API_KEY\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_google=$([[ -n \"$GOOGLE_API_KEY\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_azure=$([[ -n \"$AZURE_OPENAI_API_KEY\" && -n \"$AZURE_OPENAI_ENDPOINT\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_ollama=$([[ -n \"$OLLAMA_API_KEY\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_github_copilot=$([[ -n \"$GH_COPILOT_REFRESH\" && -n \"$GH_COPILOT_ACCESS\" ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  # =============================================================================
  # Unit Tests (always run, no secrets needed)
  # =============================================================================
  unit-tests:
    name: Unit Tests - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        group: [core, transport, protocol, providers, utils, makai-cli, tui, agent-types, agent-loop, agent-mod, agent-bridge, agent-unit, agent-chain]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Zig pattern guardrails
        run: ./scripts/check-zig-patterns.sh

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Run ${{ matrix.group }} unit tests
        run: zig build test-unit-${{ matrix.group }}

  ts-sdk-e2e:
    name: TS SDK E2E
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Build makai binary for TS SDK E2E
        run: zig build install --prefix /tmp/makai-smoke

      - name: Run TS SDK unit + E2E tests
        env:
          MAKAI_BINARY_PATH: /tmp/makai-smoke/bin/makai
        run: npm run test:sdk

      - name: Verify npm package ships TypeScript declarations
        run: npm run check:declarations

  # =============================================================================
  # Cross-compile Smoke (release-target coverage)
  #
  # Unit CI only compiles for the host (linux), so macOS/Windows release
  # targets were never compiled before the first release tag, breaking the
  # release run (#196). This job compiles every release target not already
  # covered by native jobs on every PR (compile + link only; nothing is
  # executed).
  #
  # Scoping: building for macOS requires the macOS SDK (frameworks + sysroot),
  # which hosted Linux runners do not have, so the macOS targets run on
  # macos-latest (aarch64 natively, x86_64 cross-compiled from the same SDK).
  # x86_64-windows cross-compiles from Linux using Zig's bundled mingw-w64, as
  # does aarch64-linux. The x86_64-linux release target is already compiled
  # natively by the unit-test jobs and is not repeated here.
  # =============================================================================

  cross-compile-smoke:
    name: Cross-compile - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-macos
            binary_name: makai
          - runner: macos-latest
            target: x86_64-macos
            binary_name: makai
          - runner: ubuntu-latest
            target: aarch64-linux
            binary_name: makai
          - runner: ubuntu-latest
            target: x86_64-windows
            binary_name: makai.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Zig cannot locate the macOS SDK by itself when an explicit -Dtarget is
      # passed (#196): framework resolution fails with "unable to find
      # framework 'Security'. searched paths: none". Export SDKROOT for the
      # build.zig SDK lookup and fail fast if the SDK is unusable.
      - name: Resolve macOS SDK (SDKROOT)
        if: contains(matrix.target, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=${SDK_PATH}" >> "$GITHUB_ENV"
          test -d "${SDK_PATH}/System/Library/Frameworks/Security.framework"

      - name: Compile ${{ matrix.target }} binary
        shell: bash
        run: |
          set -euo pipefail
          zig build install -Dtarget=${{ matrix.target }} --prefix "$RUNNER_TEMP/makai-smoke-${{ matrix.target }}"

      - name: Verify binary was produced
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/makai-smoke-${{ matrix.target }}/bin/${{ matrix.binary_name }}"

  # =============================================================================
  # E2E Tests (run in parallel)
  # Add new tests by adding a new job following the pattern below
  # =============================================================================

  e2e-anthropic:
    name: E2E - Anthropic
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_anthropic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Anthropic E2E tests
        run: zig build test-e2e-anthropic
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: claude-haiku-4-5

  e2e-openai:
    name: E2E - OpenAI
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_openai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run OpenAI E2E tests
        run: zig build test-e2e-openai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          OPENAI_RESPONSES_MODEL: gpt-4o-mini

  e2e-azure:
    name: E2E - Azure
    needs: [unit-tests, check-secrets]
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Azure E2E tests
        run: zig build test-e2e-azure
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL: gpt-4o-mini

  e2e-google:
    name: E2E - Google
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_google == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Google E2E tests
        run: zig build test-e2e-google
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: gemini-2.5-flash

  e2e-ollama:
    name: E2E - Ollama
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_ollama == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Ollama E2E tests
        run: zig build test-e2e-ollama
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gemma4:31b

  e2e-github-copilot:
    name: E2E - GitHub Copilot
    needs: [unit-tests, check-secrets]
    # TODO(#32): Re-enable once the CI Copilot quota resets or credentials are
    # rotated; the current token returns quota-exceeded for all tested models.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run GitHub Copilot E2E tests
        run: zig build test-e2e-github-copilot
        env:
          GH_COPILOT_REFRESH: ${{ secrets.GH_COPILOT_REFRESH }}
          GH_COPILOT_ACCESS: ${{ secrets.GH_COPILOT_ACCESS }}

  e2e-protocol:
    name: E2E - Protocol (Mock)
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Protocol E2E tests (mock-based)
        run: zig build test-e2e-protocol

  e2e-protocol-fullstack-ollama:
    name: E2E - Provider Protocol Fullstack (Ollama)
    needs: [unit-tests, check-secrets]
    if: needs.check-secrets.outputs.has_ollama == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Provider Protocol Fullstack E2E tests (Ollama)
        run: zig build test-e2e-provider-protocol-fullstack-ollama
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gemma4:31b

  e2e-protocol-fullstack-github:
    name: E2E - Provider Protocol Fullstack (GitHub Copilot)
    needs: [unit-tests, check-secrets]
    # TODO(#32): Re-enable once the CI Copilot quota resets or credentials are
    # rotated; the current token returns quota-exceeded for all tested models.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Provider Protocol Fullstack E2E tests (GitHub Copilot)
        run: zig build test-e2e-provider-protocol-fullstack-github
        env:
          GH_COPILOT_REFRESH: ${{ secrets.GH_COPILOT_REFRESH }}
          GH_COPILOT_ACCESS: ${{ secrets.GH_COPILOT_ACCESS }}

  e2e-distributed-fullstack-github:
    name: E2E - Distributed Fullstack (GitHub Copilot)
    needs: [unit-tests, check-secrets]
    # TODO(#32): Re-enable once the CI Copilot quota resets or credentials are
    # rotated; the current token returns quota-exceeded for all tested models.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - name: Run Distributed Fullstack E2E tests (GitHub Copilot)
        run: zig build test-e2e-distributed-fullstack-github
        env:
          GH_COPILOT_REFRESH: ${{ secrets.GH_COPILOT_REFRESH }}
          GH_COPILOT_ACCESS: ${{ secrets.GH_COPILOT_ACCESS }}
